name: Build Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          ls "$SDK/platforms" | tail -5

      - name: Verify project layout
        run: |
          node -e "const fs=require('fs');const cfg=require('./capacitor.config.json');const files=['www/index.html','www/app.js','www/style.css','www/lang.js','www/icon-dark.png','www/icon-light.png','capacitor.config.json','scripts/prepare-android.mjs','scripts/configure-signing.mjs','assets/android/mipmap-xxxhdpi/ic_launcher_dark.png'];for(const f of files){if(!fs.existsSync(f)){console.error('Missing '+f);process.exit(1)}}if(cfg.webDir!=='www'){console.error('capacitor.config.json webDir must be www');process.exit(1)}if(cfg.appId!=='com.shiftvault.app'){console.error('Unexpected appId');process.exit(1)}console.log('Layout OK - webDir='+cfg.webDir+' appId='+cfg.appId)"

      - name: Install dependencies
        run: npm ci

      # The keystore lives outside the repository. When the KEYSTORE_BASE64
      # secret is set it is used as-is; otherwise a keystore is generated with
      # fixed keytool parameters and kept in the Actions cache, so every later
      # build reuses the same signing identity instead of a fresh debug key.
      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.shiftvault-keystore
          key: shiftvault-signing-keystore-v1

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          DIR="$HOME/.shiftvault-keystore"
          KS="$DIR/shiftvault-release.jks"
          mkdir -p "$DIR"
          ALIAS="${KEYSTORE_ALIAS:-shiftvault}"
          PASS="${KEYSTORE_PASSWORD:-shiftvault-ci-keystore}"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
              echo "::error::KEYSTORE_PASSWORD must be set together with KEYSTORE_BASE64."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
            SOURCE="secret"
          elif [ -f "$KS" ]; then
            SOURCE="cache"
          else
            keytool -genkeypair \
              -keystore "$KS" \
              -storetype PKCS12 \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950 \
              -dname "CN=ShiftVault, OU=Android, O=ShiftVault, L=Berlin, ST=Berlin, C=DE" \
              -storepass "$PASS" \
              -keypass "$PASS"
            SOURCE="generated"
            echo "::warning::Generated a new signing keystore. Copy it into the KEYSTORE_BASE64 secret so the signature survives an Actions cache eviction."
          fi

          {
            echo "SHIFTVAULT_KEYSTORE=$KS"
            echo "SHIFTVAULT_STORE_PASSWORD=$PASS"
            echo "SHIFTVAULT_KEY_ALIAS=$ALIAS"
            echo "SHIFTVAULT_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "Signing keystore source: $SOURCE"

      - name: Add Android project
        run: npx cap add android

      - name: Install Vault icons and native plugins
        run: node scripts/prepare-android.mjs

      - name: Configure release signing
        run: node scripts/configure-signing.mjs

      - name: Sync web assets and Capacitor plugins
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk ShiftVault-Android.apk

      - name: Verify APK signature
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/build-tools/34.0.0/apksigner" verify --print-certs ShiftVault-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftVault-Android
          path: ShiftVault-Android.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ShiftVault-Android.apk
